<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Infection Linked List</title>
  <desc>Linked list where each node represents an infected district.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="white"/>

  <!-- Title -->
  <text font-family="monospace" font-size="14" font-weight="bold" x="340" y="28" text-anchor="middle" fill="black">Infection Linked List</text>

  <!-- HEAD pointer -->
  <text font-family="monospace" font-size="12" x="52" y="68" text-anchor="middle" fill="black">head</text>
  <line x1="52" y1="74" x2="52" y2="98" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- NODE 1 -->
  <rect x="12" y="100" width="80" height="138" fill="white" stroke="black" stroke-width="1"/>
  <text font-family="monospace" font-size="11" font-weight="bold" x="52" y="118" text-anchor="middle" fill="black">Node 1</text>
  <line x1="12" y1="124" x2="92" y2="124" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="52" y="142" text-anchor="middle" fill="black">row: 3</text>
  <text font-family="monospace" font-size="11" x="52" y="158" text-anchor="middle" fill="black">col: 4</text>
  <text font-family="monospace" font-size="11" x="52" y="174" text-anchor="middle" fill="black">turn: 1</text>
  <line x1="12" y1="182" x2="92" y2="182" stroke="black" stroke-width="0.8"/>
  <rect x="22" y="190" width="60" height="36" fill="#eeeeee" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="52" y="212" text-anchor="middle" fill="black">next</text>

  <!-- Arrow 1→2 -->
  <line x1="92" y1="208" x2="160" y2="208" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- NODE 2 -->
  <rect x="162" y="100" width="80" height="138" fill="white" stroke="black" stroke-width="1"/>
  <text font-family="monospace" font-size="11" font-weight="bold" x="202" y="118" text-anchor="middle" fill="black">Node 2</text>
  <line x1="162" y1="124" x2="242" y2="124" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="202" y="142" text-anchor="middle" fill="black">row: 3</text>
  <text font-family="monospace" font-size="11" x="202" y="158" text-anchor="middle" fill="black">col: 5</text>
  <text font-family="monospace" font-size="11" x="202" y="174" text-anchor="middle" fill="black">turn: 1</text>
  <line x1="162" y1="182" x2="242" y2="182" stroke="black" stroke-width="0.8"/>
  <rect x="172" y="190" width="60" height="36" fill="#eeeeee" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="202" y="212" text-anchor="middle" fill="black">next</text>

  <!-- Arrow 2→3 -->
  <line x1="242" y1="208" x2="310" y2="208" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- NODE 3 -->
  <rect x="312" y="100" width="80" height="138" fill="white" stroke="black" stroke-width="1"/>
  <text font-family="monospace" font-size="11" font-weight="bold" x="352" y="118" text-anchor="middle" fill="black">Node 3</text>
  <line x1="312" y1="124" x2="392" y2="124" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="352" y="142" text-anchor="middle" fill="black">row: 2</text>
  <text font-family="monospace" font-size="11" x="352" y="158" text-anchor="middle" fill="black">col: 4</text>
  <text font-family="monospace" font-size="11" x="352" y="174" text-anchor="middle" fill="black">turn: 2</text>
  <line x1="312" y1="182" x2="392" y2="182" stroke="black" stroke-width="0.8"/>
  <rect x="322" y="190" width="60" height="36" fill="#eeeeee" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="352" y="212" text-anchor="middle" fill="black">next</text>

  <!-- Arrow 3→4 -->
  <line x1="392" y1="208" x2="460" y2="208" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- NODE 4 -->
  <rect x="462" y="100" width="80" height="138" fill="white" stroke="black" stroke-width="1"/>
  <text font-family="monospace" font-size="11" font-weight="bold" x="502" y="118" text-anchor="middle" fill="black">Node 4</text>
  <line x1="462" y1="124" x2="542" y2="124" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="502" y="142" text-anchor="middle" fill="black">row: 4</text>
  <text font-family="monospace" font-size="11" x="502" y="158" text-anchor="middle" fill="black">col: 4</text>
  <text font-family="monospace" font-size="11" x="502" y="174" text-anchor="middle" fill="black">turn: 3</text>
  <line x1="462" y1="182" x2="542" y2="182" stroke="black" stroke-width="0.8"/>
  <rect x="472" y="190" width="60" height="36" fill="#eeeeee" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="502" y="212" text-anchor="middle" fill="black">next</text>

  <!-- Arrow 4→NULL -->
  <line x1="542" y1="208" x2="598" y2="208" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- NULL box -->
  <rect x="600" y="190" width="60" height="36" fill="white" stroke="black" stroke-width="1" stroke-dasharray="4 3"/>
  <text font-family="monospace" font-size="11" font-weight="bold" x="630" y="212" text-anchor="middle" fill="black">NULL</text>

  <!-- Turn 1 bracket -->
  <line x1="12" y1="260" x2="242" y2="260" stroke="black" stroke-width="0.8"/>
  <line x1="12" y1="255" x2="12" y2="265" stroke="black" stroke-width="0.8"/>
  <line x1="242" y1="255" x2="242" y2="265" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="127" y="278" text-anchor="middle" fill="black">Turn 1 — first spread</text>

  <!-- Turn 2 bracket -->
  <line x1="312" y1="260" x2="392" y2="260" stroke="black" stroke-width="0.8"/>
  <line x1="312" y1="255" x2="312" y2="265" stroke="black" stroke-width="0.8"/>
  <line x1="392" y1="255" x2="392" y2="265" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="352" y="278" text-anchor="middle" fill="black">Turn 2</text>

  <!-- Turn 3 bracket -->
  <line x1="462" y1="260" x2="542" y2="260" stroke="black" stroke-width="0.8"/>
  <line x1="462" y1="255" x2="462" y2="265" stroke="black" stroke-width="0.8"/>
  <line x1="542" y1="255" x2="542" y2="265" stroke="black" stroke-width="0.8"/>
  <text font-family="monospace" font-size="11" x="502" y="278" text-anchor="middle" fill="black">Turn 3</text>

  <!-- Footer -->
  <text font-family="monospace" font-size="11" x="340" y="318" text-anchor="middle" fill="#444444">Nodes are appended in chronological order. Traversal drives plague spread each turn.</text>
  <text font-family="monospace" font-size="10" x="340" y="348" text-anchor="middle" fill="#666666">row, col: grid position  ·  turn: infection turn  ·  next: pointer to next infected district</text>
</svg>
